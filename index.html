<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div class="container">
      <h1>Todo App</h1>
      <form class="todo-form">
        <input type="text" id="todo-input" placeholder="Add a new todo" />
        <button type="submit">Add</button>
      </form>
      <!-- error handling message : CSS added:: .input-error & #error-message -->
<p id="error-message">Please enter a todo item</p>
<div>
  <label for="todo-search">Search tasks</label>
  <input id="todo-search" type="search" />
</div>
<label for="status-filter">Show tasks</label>
      <select id="status-filter">
        <option value="all">All</option>
        <option value="active">Active</option>
        <option value="completed">Completed</option>
      </select>
      <ul class="todo-list" id="todo-list"></ul>

      <input type="color" id="colorPicker" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
